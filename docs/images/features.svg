<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Your voice, your way: push to talk, voice activation, channels and chat</title>
  <desc id="desc">Original vector illustration of a person wearing a headset and using a phone. Three labels describe the client's push-to-talk, voice activation, and channel chat features. The small phone is a simplified illustrated client preview, not a screenshot. Northstar, Lobby, Mica, Orbit, and the displayed connection value are fictional illustrative data.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .text { fill: #E6E8EA; }
      .dim { fill: #9BA1A6; }
      .blue { fill: #1A91D0; }
      .icon { fill: none; stroke: #1A91D0; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="mic" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="8" y="3" width="8" height="12" rx="4"/>
      <path d="M5 11v2a7 7 0 0 0 14 0v-2M12 20v3M8 23h8"/>
    </g>
    <g id="headphones" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15v-3a8 8 0 0 1 16 0v3"/>
      <rect x="3" y="13" width="5" height="9" rx="2"/>
      <rect x="16" y="13" width="5" height="9" rx="2"/>
    </g>
  </defs>

